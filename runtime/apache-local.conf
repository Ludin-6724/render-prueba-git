ServerName localhost
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>
<LocationMatch "^/(wp-cron\.php|xmlrpc\.php|wp-content/ai1wm-backups/)">
    Require all denied
</LocationMatch>
Header always set Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' data: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; frame-src 'self'; connect-src 'self'; form-action 'self'; object-src 'none'; base-uri 'self'"
Header always set X-Robots-Tag "noindex, nofollow, noarchive"
