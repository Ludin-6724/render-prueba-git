<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>¡Gracias! — RENDER Multimedia</title>
    <link rel="icon" type="image/svg+xml" href="/brand/isotipo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Archivo+Black&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0b0b0b;
        color: #fff4e9;
        font-family: 'Archivo', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      img { width: 90px; height: auto; margin-bottom: 2.5rem; }
      h1 {
        font-family: 'Archivo Black', 'Archivo', sans-serif;
        text-transform: uppercase;
        font-size: clamp(2.2rem, 7vw, 4.5rem);
        line-height: 0.95;
        letter-spacing: -0.02em;
      }
      h1 span { color: #f7ac42; }
      p {
        margin-top: 1.5rem;
        max-width: 32rem;
        color: rgba(255, 244, 233, 0.6);
        font-size: 1.05rem;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 3rem;
        padding: 1rem 2.5rem;
        background: #f7ac42;
        color: #0b0b0b;
        text-decoration: none;
        font-family: 'Archivo Black', 'Archivo', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      a:hover { background: #fff4e9; }
    </style>
  </head>
  <body>
    <img src="/brand/isotipo.svg" alt="RENDER Multimedia" />
    <h1>¡<span>Gracias</span>!</h1>
    <p>Muy pronto nos comunicaremos contigo.</p>
    <a href="/">Volver al inicio</a>
  </body>
</html>
